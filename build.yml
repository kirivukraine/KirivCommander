name: Build KirivCommander APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Дозволи для GITHUB_TOKEN
permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: List APKs
        run: find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KirivCommander-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KirivCommander-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Явні дозволи для job release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Get version name
        id: ver
        run: |
          VER=$(grep 'versionName' app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Версія: $VER"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             KirivCommander-v${{ steps.ver.outputs.version }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: KirivCommander v${{ steps.ver.outputs.version }}
          body: |
            ## KirivCommander v${{ steps.ver.outputs.version }}
            **by KirivSoft / Іван Кіранчук**

            ### Встановлення APK
            1. Завантажте файл нижче
            2. Android → Налаштування → Безпека → Невідомі джерела ✓
            3. Відкрийте APK → Встановити

            ### Функції
            - Двопанельний файловий менеджер
            - Root-доступ (libsu)
            - Текстовий редактор з пошуком
            - ExoPlayer медіаплеєр
            - Переглядач фото, PDF
            - FTP / SMB / SFTP
            - Пошук: regex, по вмісту
          files: KirivCommander-v${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
